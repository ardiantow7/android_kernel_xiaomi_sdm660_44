name: Build Kernel 4.4 SDM660

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig yang dipakai'
        required: false
        default: 'whyred_defconfig'
      toolchain:
        description: 'Toolchain Clang yang dipakai'
        required: false
        default: 'zyc14'
        type: choice
        options:
          - zyc14
          - proton13
          - aosp13
          - neutron
      lto_mode:
        description: 'Mode LTO (thin/full/none)'
        required: false
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none
      artifact_scope:
        description: 'File yang diupload sebagai artifact'
        required: false
        default: 'ringkas'
        type: choice
        options:
          - ringkas
          - lengkap
      qti:
        description: 'Aktifkan CONFIG_INPUT_QTI_HAPTICS'
        required: false
        default: false
        type: boolean
      newcam:
        description: 'Aktifkan CONFIG_XIAOMI_NEW_CAMERA_BLOBS'
        required: false
        default: false
        type: boolean
  # Trigger "push" sengaja tidak dipakai - workflow ini cuma dijalankan
  # manual lewat tombol "Run workflow" di halaman Actions (workflow_dispatch).
  # Kalau nanti mau otomatis jalan lagi tiap ada commit baru, tambahkan
  # kembali blok berikut sejajar dengan "workflow_dispatch:" di atas:
  #
  push:
    branches:
      - test-sf

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  # TC_DIR sama untuk keempat pilihan toolchain - hanya salah satu yang
  # benar-benar diisi tergantung pilihan "toolchain" di atas.
  TC_DIR: ${{ github.workspace }}/toolchain/clang
  OUT_DIR: ${{ github.workspace }}/kernel/out

  # --- Sumber tiap toolchain ---
  # zyc14    -> ZyC Clang 14.0.6 (build 20260619) - default
  ZYC_CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz
  # proton13 -> Proton Clang (kdrag0n), rilis terakhir = Clang 13.0.0 (20210522).
  #             Repo ini sudah tidak diupdate lagi sejak 2021, jadi clone branch
  #             main = otomatis dapat versi Clang 13 tsb.
  PROTON_CLANG_REPO: https://github.com/kdrag0n/proton-clang
  # aosp13   -> AOSP Clang r433403 (Clang 13.0.2). Di-pin ke commit hash
  #             spesifik (bukan refs/heads/main) karena Google rutin
  #             menghapus direktori clang lama dari HEAD branch main -
  #             pinning ke commit membuat link ini permanen, tidak akan
  #             basi lagi walau main terus "dibersihkan" ke depannya.
  AOSP_CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  AOSP_CLANG_TAG: r433403
  AOSP_CLANG_REF: f8d88753369cf620ad22e23ef1d77fac27f90c8c
  # neutron  -> Neutron Clang, di-sync ke build TERBARU tiap kali workflow
  #             jalan lewat AntMan (Neutron rilis build baru tiap Sabtu).

  # Hapus tanda # di baris bawah ini jika ingin set tanggal build manual/custom.
  # Jika tetap dikomentari (default), kernel pakai timestamp build asli dari runner.
  # KBUILD_BUILD_TIMESTAMP="Sun June 21 16:02:52 WIB 2026"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # batas runner free 6 jam, beri margin

    steps:
      # ------------------------------------------------------------------
      # 1. CHECKOUT SOURCE
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          path: kernel

      # ------------------------------------------------------------------
      # 2. CEK SISA DISK
      # ------------------------------------------------------------------
      - name: Cek sisa disk
        run: df -h /

      # ------------------------------------------------------------------
      # 3. SWAP TAMBAHAN (selalu aktif, ukuran menyesuaikan mode LTO)
      # ------------------------------------------------------------------
      - name: Setup swap tambahan
        run: |
          LTO_MODE="${{ github.event.inputs.lto_mode || 'thin' }}"

          if [ "$LTO_MODE" = "full" ]; then
            SWAP_SIZE="8G"
          else
            SWAP_SIZE="4G"
          fi

          echo "Menambahkan swap ${SWAP_SIZE} (mode LTO: ${LTO_MODE})..."
          sudo fallocate -l "$SWAP_SIZE" /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      # ------------------------------------------------------------------
      # 4. INSTALL DEPENDENCIES BUILD
      #    git dibutuhkan juga untuk clone Proton Clang (opsi toolchain).
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential zip curl git python3 \
            python-is-python3 ccache llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ------------------------------------------------------------------
      # 5. TENTUKAN VERSI TOOLCHAIN (dipakai sebagai cache key)
      #    zyc14/proton13/aosp13 -> versi statis, cache tersimpan permanen
      #    neutron                -> cache dirotasi tiap minggu (mengikuti
      #                              jadwal rilis build baru Neutron tiap Sabtu)
      #                              supaya tetap dapat build terbaru berkala.
      # ------------------------------------------------------------------
      - name: Tentukan versi toolchain
        id: tcver
        run: |
          TOOLCHAIN="${{ github.event.inputs.toolchain || 'zyc14' }}"

          case "$TOOLCHAIN" in
            zyc14)
              VER="14.0.6-20260619"
              ;;
            proton13)
              VER="clang13-20210522"
              ;;
            aosp13)
              VER="${AOSP_CLANG_TAG}"
              ;;
            neutron)
              VER="week-$(date +'%G-W%V')"
              ;;
            *)
              echo "Toolchain tidak dikenali: $TOOLCHAIN"
              exit 1
              ;;
          esac

          echo "toolchain=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 6. CACHE TOOLCHAIN CLANG
      #    (supaya tidak download/clone ulang setiap run)
      # ------------------------------------------------------------------
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ env.TC_DIR }}
          key: toolchain-${{ steps.tcver.outputs.toolchain }}-${{ steps.tcver.outputs.ver }}

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN="${{ steps.tcver.outputs.toolchain }}"
          mkdir -p "$TC_DIR"

          case "$TOOLCHAIN" in
            zyc14)
              echo "Mengunduh ZyC Clang 14.0.6..."
              curl -L --fail "$ZYC_CLANG_URL" -o /tmp/clang.tar.gz
              tar -xzf /tmp/clang.tar.gz -C "$TC_DIR"
              rm -f /tmp/clang.tar.gz
              ;;
            proton13)
              echo "Mengkloning Proton Clang (Clang 13.0.0)..."
              git clone --depth=1 "$PROTON_CLANG_REPO" "$TC_DIR"
              ;;
            aosp13)
              echo "Mengunduh AOSP Clang ${AOSP_CLANG_TAG} (13.0.2)..."
              curl -L --fail \
                "${AOSP_CLANG_URL}/+archive/${AOSP_CLANG_REF}/clang-${AOSP_CLANG_TAG}.tar.gz" \
                -o /tmp/clang.tar.gz
              tar -xzf /tmp/clang.tar.gz -C "$TC_DIR"
              rm -f /tmp/clang.tar.gz
              ;;
            neutron)
              echo "Sinkronisasi Neutron Clang terbaru lewat AntMan..."
              mkdir -p "$TC_DIR"
              cd "$TC_DIR"
              curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
              chmod +x antman
              ./antman -S
              ;;
          esac

      # ------------------------------------------------------------------
      # 7. CACHE CCACHE (mempercepat rebuild berikutnya)
      #    Key ikut membedakan toolchain, supaya objek cache dari clang
      #    yang berbeda tidak tercampur.
      # ------------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ steps.tcver.outputs.toolchain }}-${{ github.event.inputs.defconfig || 'whyred_defconfig' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.tcver.outputs.toolchain }}-${{ github.event.inputs.defconfig || 'whyred_defconfig' }}-

      - name: Setup ccache
        run: |
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -z

      # ------------------------------------------------------------------
      # 8. SETUP TOOLCHAIN ENV
      # ------------------------------------------------------------------
      - name: Setup toolchain PATH
        run: echo "$TC_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain info
        run: |
          which clang
          clang --version

      # ------------------------------------------------------------------
      # 8.5. SIAPKAN NAMA ARTIFACT
      #      Format: kernel-4.4-{toolchain}-{branch}-{run_number}-{tanggal}
      #      Contoh: kernel-4.4-zyc14-cp-st-7-22062026
      #      Ditaruh sebelum step Build & pakai always() supaya nama ini
      #      tetap tersedia walau build/verify gagal di tengah jalan.
      # ------------------------------------------------------------------
      - name: Siapkan nama artifact
        id: meta
        if: always()
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SAFE="${BRANCH_NAME//\//-}"
          TANGGAL=$(date +'%d%m%Y')
          TOOLCHAIN="${{ steps.tcver.outputs.toolchain || 'zyc14' }}"
          echo "artifact_name=kernel-4.4-${TOOLCHAIN}-${BRANCH_SAFE}-${{ github.run_number }}-${TANGGAL}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 9. BUILD KERNEL (dengan timer)
      #    CROSS_COMPILE/CROSS_COMPILE_ARM32/CLANG_TRIPLE/LDFLAGS mengikuti
      #    pola yang sudah terbukti jalan di script lokal newbuild44-*.sh -
      #    sama untuk keempat toolchain (semuanya pakai GNU binutils dari
      #    apt sebagai pelengkap llvm tools).
      # ------------------------------------------------------------------
      - name: Build kernel
        id: build
        run: |
          START_TIME=$(date +%s)

          cd "$KERNEL_DIR"
          mkdir -p "$OUT_DIR"

          DEFCONFIG="${{ github.event.inputs.defconfig || 'whyred_defconfig' }}"
          LTO_MODE="${{ github.event.inputs.lto_mode || 'thin' }}"
          TOOLCHAIN="${{ steps.tcver.outputs.toolchain }}"

          CUSTOM_CFLAGS="-march=armv8-a -mno-outline"

          TOOLCHAIN_ARGS=(
            ARCH=arm64
            CC="ccache clang"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            READELF=llvm-readelf
            OBJSIZE=llvm-size
            LLVM=1
            LLVM_IAS=1
            KBUILD_BUILD_USER=builder
            KBUILD_BUILD_HOST=ardiantowb
            LDFLAGS="-m aarch64elf"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            # -fuse-ld=lld untuk host tool (fixdep dkk): beberapa toolchain
            # (Proton/AOSP Clang, keduanya dari 2021) membawa ld lama yang
            # belum kenal section .relr.dyn di glibc runner Ubuntu sekarang -
            # ld.lld jauh lebih baru dan aman dipakai untuk build host.
            HOSTCFLAGS="-fuse-ld=lld"
            HOSTLDFLAGS="-fuse-ld=lld"
            KCFLAGS="$CUSTOM_CFLAGS"
          )

          if [ "$LTO_MODE" != "none" ]; then
            TOOLCHAIN_ARGS+=(LTO="$LTO_MODE")
          fi

          # Pakai timestamp custom hanya jika KBUILD_BUILD_TIMESTAMP di-set di atas (env:)
          if [ -n "${KBUILD_BUILD_TIMESTAMP:-}" ]; then
            TOOLCHAIN_ARGS+=(KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP")
          fi

          echo "=== Defconfig: $DEFCONFIG | LTO: $LTO_MODE | Toolchain: $TOOLCHAIN ==="

          LOG_FILE="${{ github.workspace }}/build.log"

          make O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" "$DEFCONFIG" 2>&1 | tee "$LOG_FILE"

          # --- Opsi tambahan (qti / newcam) ---
          # Diterapkan ke .config hasil defconfig lewat scripts/config (bukan
          # sed manual ke file defconfig), lalu olddefconfig supaya symbol
          # Kconfig yang bergantung padanya tetap konsisten/tidak nyangkut
          # prompt interaktif.
          QTI_HAPTICS="${{ github.event.inputs.qti || 'false' }}"
          NEW_CAMERA="${{ github.event.inputs.newcam || 'false' }}"
          EXTRA_OPTS=""

          if [ "$QTI_HAPTICS" = "true" ]; then
            echo "Mengaktifkan CONFIG_INPUT_QTI_HAPTICS..."
            bash scripts/config --file "$OUT_DIR/.config" -e CONFIG_INPUT_QTI_HAPTICS
            EXTRA_OPTS="${EXTRA_OPTS}qti "
          fi

          if [ "$NEW_CAMERA" = "true" ]; then
            echo "Mengaktifkan CONFIG_XIAOMI_NEW_CAMERA_BLOBS..."
            bash scripts/config --file "$OUT_DIR/.config" -e CONFIG_XIAOMI_NEW_CAMERA_BLOBS
            EXTRA_OPTS="${EXTRA_OPTS}newcam "
          fi

          if [ -n "$EXTRA_OPTS" ]; then
            make O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" olddefconfig 2>&1 | tee -a "$LOG_FILE"
          fi

          make -j"$(nproc --all)" O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" 2>&1 | tee -a "$LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}

          ccache -s | tee -a "$LOG_FILE"

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          echo "-----------------------------------------------------"
          echo "Waktu total kompilasi: ${MIN} menit ${SEC} detik"
          echo "-----------------------------------------------------"

          # Simpan sebagai output step agar bisa dipakai di step summary/step lain
          echo "duration_min=${MIN}" >> "$GITHUB_OUTPUT"
          echo "duration_sec=${SEC}" >> "$GITHUB_OUTPUT"
          echo "defconfig=${DEFCONFIG}" >> "$GITHUB_OUTPUT"
          echo "lto_mode=${LTO_MODE}" >> "$GITHUB_OUTPUT"
          echo "toolchain=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
          echo "extra_opts=${EXTRA_OPTS:-tidak ada}" >> "$GITHUB_OUTPUT"

          exit "$BUILD_EXIT"

      # ------------------------------------------------------------------
      # 10. CEK HASIL BUILD
      # ------------------------------------------------------------------
      - name: Verify build output
        run: |
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ] || [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "BUILD BERHASIL"
          else
            echo "BUILD GAGAL - file Image.gz tidak ditemukan"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 11. UPLOAD ARTIFACT
      #     "ringkas"  -> semua file di out/arch/arm64/boot/ (Image, Image.gz,
      #                   Image.gz-dtb, dan folder dts/.../*.dtb di dalamnya)
      #     "lengkap"  -> seluruh isi out/ seperti hasil build local (vmlinux,
      #                   System.map, semua .o, dll). Bisa beberapa GB & lebih lama diupload.
      # ------------------------------------------------------------------
      - name: Upload kernel image (ringkas - folder boot)
        if: ${{ (github.event.inputs.artifact_scope || 'ringkas') == 'ringkas' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel build (lengkap, seluruh folder out / seperti build local)
        if: ${{ github.event.inputs.artifact_scope == 'lengkap' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-out
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------
      # 11.5. UPLOAD LOG BUILD
      #       Selalu jalan (always()) baik build sukses maupun gagal, supaya
      #       log tetap bisa dicek kalau ada error.
      # ------------------------------------------------------------------
      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-log
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------------
      # 12. STEP SUMMARY
      #     Tampilkan ringkasan build (waktu, defconfig, toolchain, LTO)
      #     langsung di halaman run GitHub Actions
      # ------------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Ringkasan Build Kernel 4.4"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Defconfig | \`${{ steps.build.outputs.defconfig }}\` |"
            echo "| Toolchain | \`${{ steps.build.outputs.toolchain }}\` |"
            echo "| Mode LTO | \`${{ steps.build.outputs.lto_mode }}\` |"
            echo "| Waktu kompilasi | **${{ steps.build.outputs.duration_min }} menit ${{ steps.build.outputs.duration_sec }} detik** |"
            echo "| Opsi tambahan | \`${{ steps.build.outputs.extra_opts }}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
